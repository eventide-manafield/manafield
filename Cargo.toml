[package]
name = "manafield"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
autobins = false

[features]
default = []
build-plan = []
ingress-traefik = []

[dependencies]
arc-swap = "1"
axum = "0.8"
postgres = "0.19"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[bin]]
name = "manafield"
path = "src/bin/manafield.rs"

[[bin]]
name = "manafield-core"
path = "src/main.rs"

[[bin]]
name = "manafield-build-plan"
path = "src/bin/manafield-build-plan.rs"
required-features = ["build-plan"]

[[bin]]
name = "manafield-ingress-traefik"
path = "src/bin/manafield-ingress-traefik.rs"
required-features = ["ingress-traefik"]

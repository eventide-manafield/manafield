[package]
name = "manafield"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"

[features]
default = []
build-plan = ["dep:serde_yaml_ng"]

[dependencies]
arc-swap = "1"
axum = "0.8"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = { version = "0.10", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[bin]]
name = "manafield-build-plan"
path = "src/bin/manafield-build-plan.rs"
required-features = ["build-plan"]

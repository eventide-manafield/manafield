services:
  module-manafield-reference:
    image: ${MANAFIELD_REFERENCE_IMAGE:?digest required}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PORT: "8080"
      MANAFIELD_CORE_URL: http://core:8080
      MANAFIELD_MODULE_ID: manafield-reference
    ports:
      - "127.0.0.1:${MANAFIELD_REFERENCE_PORT:-8080}:8080"
    tmpfs: [/tmp]
    depends_on:
      core: {condition: service_healthy}
    healthcheck:
      test: [CMD, /nodejs/bin/node, /app/healthcheck.cjs]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s
    networks: [modules]

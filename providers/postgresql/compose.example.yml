name: manafield-postgresql

services:
  manafield-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MANAFIELD_POSTGRES_DB:-manafield}
      POSTGRES_USER: ${MANAFIELD_POSTGRES_USER:-manafield}
      POSTGRES_PASSWORD: ${MANAFIELD_POSTGRES_PASSWORD:-manafield}
    volumes:
      - manafield-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      modules:
        aliases:
          - manafield-postgres

  provider:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MANAFIELD_CORE_URL: http://core:8080
      MANAFIELD_RESOURCE_ID: manafield-postgres
      MANAFIELD_RESOURCE_NAME: Manafield PostgreSQL
      POSTGRES_HOST: manafield-postgres
      POSTGRES_PORT: 5432
      MANAFIELD_POSTGRES_CAPABILITY_VERSION: 1.0.0
      MANAFIELD_RESOURCE_CHECK_INTERVAL: 5
    depends_on:
      manafield-postgres:
        condition: service_healthy
    networks:
      - modules

volumes:
  manafield-postgres-data:

networks:
  modules:
    external: true
    name: ${MANAFIELD_MODULES_NETWORK:-manafield-modules}

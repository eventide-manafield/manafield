name: manafield-example-postgresql

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MANAFIELD_EXAMPLE_POSTGRES_DB:-manafield}
      POSTGRES_USER: ${MANAFIELD_EXAMPLE_POSTGRES_USER:-manafield}
      POSTGRES_PASSWORD: ${MANAFIELD_EXAMPLE_POSTGRES_PASSWORD:-manafield}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      modules:
        aliases:
          - example-postgres

  provider:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MANAFIELD_CORE_URL: http://core:8080
      MANAFIELD_RESOURCE_ID: example-postgres
      MANAFIELD_RESOURCE_NAME: Example PostgreSQL
      POSTGRES_HOST: example-postgres
      POSTGRES_PORT: 5432
      MANAFIELD_POSTGRES_CAPABILITY_VERSION: 1.0.0
      MANAFIELD_RESOURCE_CHECK_INTERVAL: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - modules

volumes:
  postgres-data:

networks:
  modules:
    external: true
    name: ${MANAFIELD_MODULES_NETWORK:-manafield-modules}
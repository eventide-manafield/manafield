name: manafield

services:
  core:
    image: ${MANAFIELD_CORE_IMAGE:-manafield-core:local}
    restart: unless-stopped
    init: true
    environment:
      MANAFIELD_BIND: 0.0.0.0:8080
      MANAFIELD_MODULES_DIR: /var/lib/manafield/modules
      RUST_LOG: ${MANAFIELD_LOG:-manafield=info,manafield_core=info}
      MANAFIELD_LOG_FILE: /var/lib/manafield/logs/core.jsonl
      MANAFIELD_LOG_POSTGRES_DSN_FILE: ${MANAFIELD_LOG_POSTGRES_DSN_FILE:-}
      MANAFIELD_LOG_POSTGRES_SCHEMA: ${MANAFIELD_LOG_POSTGRES_SCHEMA:-}
    ports:
      - "127.0.0.1:${MANAFIELD_CORE_PORT:-18080}:8080"
    volumes:
      - type: bind
        source: ${MANAFIELD_MODULES_PATH:-./modules}
        target: /var/lib/manafield/modules
        read_only: true
      - type: volume
        source: manafield-core-logs
        target: /var/lib/manafield/logs
      - type: bind
        source: ${MANAFIELD_LOG_DSN_FILE_HOST:-/dev/null}
        target: /run/manafield/logging/postgres.dsn
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - modules

  manafield-postgres:
    profiles:
      - postgresql
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MANAFIELD_POSTGRES_DB:-manafield}
      POSTGRES_USER: ${MANAFIELD_POSTGRES_USER:-manafield}
      POSTGRES_PASSWORD: ${MANAFIELD_POSTGRES_PASSWORD:-manafield}
    volumes:
      - manafield-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      modules:
        aliases:
          - manafield-postgres

  manafield-postgres-provider:
    profiles:
      - postgresql
    image: ${MANAFIELD_POSTGRES_PROVIDER_IMAGE:-manafield-resource-postgresql:local}
    restart: unless-stopped
    init: true
    environment:
      MANAFIELD_CORE_URL: http://core:8080
      MANAFIELD_RESOURCE_ID: ${MANAFIELD_POSTGRES_RESOURCE_ID:-manafield-postgres}
      MANAFIELD_RESOURCE_NAME: ${MANAFIELD_POSTGRES_RESOURCE_NAME:-Manafield PostgreSQL}
      MANAFIELD_POSTGRES_ALLOCATIONS_FILE: /run/manafield/postgresql/allocations.tsv
      POSTGRES_HOST: manafield-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${MANAFIELD_POSTGRES_DB:-manafield}
      POSTGRES_USER: ${MANAFIELD_POSTGRES_USER:-manafield}
      PGPASSWORD: ${MANAFIELD_POSTGRES_PASSWORD:-manafield}
      MANAFIELD_POSTGRES_CAPABILITY_VERSION: 1.0.0
      MANAFIELD_RESOURCE_CHECK_INTERVAL: 5
    volumes:
      - type: bind
        source: ${MANAFIELD_POSTGRES_ALLOCATIONS_FILE_HOST:-/dev/null}
        target: /run/manafield/postgresql/allocations.tsv
        read_only: true
      - type: bind
        source: ${MANAFIELD_POSTGRES_SECRETS_PATH:-/tmp/manafield-postgresql-secrets}
        target: /run/manafield/postgresql/secrets
        read_only: true
    depends_on:
      core:
        condition: service_healthy
      manafield-postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - modules


  # External S3-compatible Resource observer (Cloudflare R2, MinIO, etc.).
  # Neither Manafield Core nor this Provider handles application object bytes.
  manafield-s3-provider:
    profiles:
      - s3
    image: ${MANAFIELD_S3_PROVIDER_IMAGE:-manafield-resource-s3:local}
    restart: unless-stopped
    init: true
    environment:
      MANAFIELD_CORE_URL: http://core:8080
      MANAFIELD_RESOURCE_ID: ${MANAFIELD_S3_RESOURCE_ID:-manafield-s3}
      MANAFIELD_RESOURCE_NAME: ${MANAFIELD_S3_RESOURCE_NAME:-Manafield S3 Object Storage}
      MANAFIELD_S3_ENDPOINT: ${MANAFIELD_S3_ENDPOINT:-}
      MANAFIELD_S3_BUCKET: ${MANAFIELD_S3_BUCKET:-}
      MANAFIELD_S3_REGION: ${MANAFIELD_S3_REGION:-auto}
      MANAFIELD_S3_FORCE_PATH_STYLE: ${MANAFIELD_S3_FORCE_PATH_STYLE:-true}
      MANAFIELD_S3_ACCESS_KEY_ID_FILE: /run/manafield/s3/access-key-id
      MANAFIELD_S3_SECRET_ACCESS_KEY_FILE: /run/manafield/s3/secret-access-key
      MANAFIELD_RESOURCE_CHECK_INTERVAL: 15
    volumes:
      - type: bind
        source: ${MANAFIELD_S3_ACCESS_KEY_ID_HOST:-/dev/null}
        target: /run/manafield/s3/access-key-id
        read_only: true
      - type: bind
        source: ${MANAFIELD_S3_SECRET_ACCESS_KEY_HOST:-/dev/null}
        target: /run/manafield/s3/secret-access-key
        read_only: true
    depends_on:
      core:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - modules


  # Redis is exclusive to its declared consumer; it also stores durable job queues.
  # Redis password is read from a mounted file; NEVER expose it in CLI argv.
  manafield-redis:
    profiles: [redis]
    image: ${MANAFIELD_REDIS_SERVER_IMAGE:-manafield-resource-redis-server:local}
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
          umask 077
          secret="$$(cat /run/manafield/redis/password)"
          case "$$secret" in ""|*[!0-9a-f]*) exit 1;; esac
          printf 'requirepass %s\nappendonly yes\nappendfsync everysec\nmaxmemory-policy noeviction\ndir /data\n' "$$secret" > /tmp/redis.conf
          unset secret
          exec redis-server /tmp/redis.conf
    volumes:
      - manafield-redis-data:/data
      - type: bind
        source: ${MANAFIELD_REDIS_PASSWORD_HOST:-/dev/null}
        target: /run/manafield/redis/password
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$(cat /run/manafield/redis/password)" redis-cli ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 15
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [modules]

  manafield-redis-provider:
    profiles: [redis]
    image: ${MANAFIELD_REDIS_PROVIDER_IMAGE:-manafield-resource-redis-provider:local}
    restart: unless-stopped
    init: true
    environment:
      MANAFIELD_CORE_URL: http://core:8080
      MANAFIELD_RESOURCE_ID: ${MANAFIELD_REDIS_RESOURCE_ID:-redis-resource}
      MANAFIELD_RESOURCE_NAME: Manafield Redis Cache
      MANAFIELD_REDIS_HOST: manafield-redis
      MANAFIELD_REDIS_PORT: 6379
      MANAFIELD_REDIS_PASSWORD_FILE: /run/manafield/redis/password
      MANAFIELD_RESOURCE_CHECK_INTERVAL: 15
    volumes:
      - type: bind
        source: ${MANAFIELD_REDIS_PASSWORD_HOST:-/dev/null}
        target: /run/manafield/redis/password
        read_only: true
    depends_on:
      core: {condition: service_healthy}
      manafield-redis: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [modules]

volumes:
  manafield-core-logs:
  manafield-postgres-data:
  manafield-redis-data:

networks:
  modules:
    name: ${MANAFIELD_MODULES_NETWORK:-manafield-modules}
  edge:
    external: true
    name: ${MANAFIELD_EDGE_NETWORK:-manafield-edge}
